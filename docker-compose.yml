version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: cheremsha
      POSTGRES_PASSWORD: password67
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  etcd-db:
    image: gcr.io/etcd-development/etcd:v3.5.11
    container_name: etcd-db
    environment:
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd-db:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    restart: unless-stopped

  fitness-app:
    build: .
    container_name: fitness-app
    ports:
      - "8080:8080"
    environment:
      - ETCD_ENDPOINTS=http://etcd-db:2379
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=cheremsha
      - SPRING_DATASOURCE_PASSWORD=password67
    depends_on:
      - postgres-db
      - etcd-db
    restart: unless-stopped

volumes:
  postgres_data: